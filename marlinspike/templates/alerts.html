{% extends "base.html" %}
{% block title %}SentinelOT — Live Alerts{% endblock %}
{% block body %}
<div class="ms-content">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title-wrap">
        <h2>Live Detection Alerts</h2>
        <div class="panel-subtitle">Real-time passive OT anomaly detection</div>
      </div>
      <button class="btn btn-sm" onclick="MS_ALERTS.fetchAlerts()">Refresh</button>
    </div>
    <div class="panel-body">
      <div class="dashboard-table-wrap">
        <table class="ms-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Severity</th>
              <th>Rule</th>
              <th>Source</th>
              <th>Destination</th>
              <th>Protocol</th>
              <th>Explanation</th>
            </tr>
          </thead>
          <tbody id="alerts-body">
            <tr><td colspan="7"><div class="ms-loading"><div class="ms-spinner"></div> Loading alerts...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce }}">
var MS_ALERTS = (function() {
  function fetchAlerts() {
    fetch('/api/live/alerts')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var tbody = document.getElementById('alerts-body');
        if (!data.alerts || data.alerts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7"><div class="ms-empty"><div class="ms-empty-title">No alerts detected yet.</div><div class="ms-empty-sub">The watcher is running. Trigger some OT traffic to see alerts.</div></div></td></tr>';
          return;
        }
        tbody.innerHTML = '';
        data.alerts.forEach(function(a) {
          var tr = document.createElement('tr');
          tr.innerHTML = '<td class="mono dim">' + new Date(a.ts).toLocaleTimeString() + '</td>' +
            '<td><span class="chip chip-' + a.severity.toLowerCase() + '">' + a.severity + '</span></td>' +
            '<td><span class="mono">' + a.rule + '</span></td>' +
            '<td class="mono">' + a.src_ip + '</td>' +
            '<td class="mono">' + (a.dst_ip || '—') + '</td>' +
            '<td>' + (a.protocol || '—') + '</td>' +
            '<td style="font-size:0.85em; color:var(--text-dim); max-width:400px;">' + a.message + '</td>';
          tbody.appendChild(tr);
        });
      });
  }
  document.addEventListener('DOMContentLoaded', function() {
    fetchAlerts();
    setInterval(fetchAlerts, 3000);
  });
  return { fetchAlerts: fetchAlerts };
})();
</script>
{% endblock %}
