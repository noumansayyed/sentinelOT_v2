<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{{ t('login.title') }}</title>
<style nonce="{{ csp_nonce }}">
  html { visibility: hidden; }
  :root {
    --bg: #000000; --bg-deep: #000000; --bg-surface: #0a0a0a;
    --panel: #000000; --panel-alt: #0a0a0a; --panel-strong: #111111;
    --border: #FFFFFF; --border-dim: #FFFFFF; --border-bright: #FF5A00;
    --text: #FFFFFF; --text-dim: #BFBFBF; --text-muted: #7A7A7A;
    --accent: #FF5A00; --accent-hover: #FF7A2E;
    --font-mono: 'Fira Code', monospace;
    --font-ui: 'Inter', sans-serif;
  }
  html[data-theme="light"] {
    --bg: #FFFFFF; --bg-deep: #FFFFFF; --bg-surface: #F5F5F5;
    --panel: #FFFFFF; --panel-alt: #F5F5F5; --panel-strong: #EAEAEA;
    --border: #000000; --border-dim: #000000; --border-bright: #FF5A00;
    --text: #000000; --text-dim: #333333; --text-muted: #666666;
    --accent: #FF5A00; --accent-hover: #E04E00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-ui);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .login-card {
    background: var(--panel); border: 2px solid var(--border); padding: 40px;
    width: 100%; max-width: 400px; text-align: center;
  }
  .login-brand .brand-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; background: var(--accent); border: 2px solid var(--accent);
    font-size: 1.2em; font-weight: 900; color: #000; margin-bottom: 16px;
  }
  h1 { font-size: 1.5em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .login-sub { font-size: 0.85em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 32px; }
  .login-field { text-align: left; margin-bottom: 20px; }
  .login-field label { display: block; font-size: 0.75em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; color: var(--text); }
  .login-field input {
    width: 100%; padding: 12px; background: var(--panel-alt); border: 2px solid var(--border);
    color: var(--text); font-family: var(--font-ui); font-size: 1em;
  }
  .login-field input:focus { outline: none; border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 12px; background: var(--accent); border: 2px solid var(--accent);
    color: #000; font-size: 0.9em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    cursor: pointer; margin-top: 12px;
  }
  .login-btn:hover { background: var(--text); border-color: var(--text); }
  .login-error { color: var(--accent); margin-bottom: 16px; font-weight: bold; }
  .login-footer { margin-top: 24px; font-size: 0.85em; display: flex; justify-content: center; gap: 16px; }
  .login-footer a { color: var(--text-dim); text-decoration: none; text-transform: uppercase; font-weight: 600; }
  .login-footer a:hover { color: var(--accent); }
  .locale-active { color: var(--accent); font-weight: 800; }
</style>
<script nonce="{{ csp_nonce }}">
  (function() {
    var storedTheme = localStorage.getItem('ms_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', storedTheme);
    document.documentElement.style.visibility = 'visible';
  })();
</script>
</head>
<body>
<div class="login-card">
  <div class="login-brand">
    <div class="brand-icon">MS</div>
    <h1><span>SentinelOT</span></h1>
  </div>
  <div class="login-sub">{{ t('login.tagline') }}</div>
  {% if error %}
  <div class="login-error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <div class="login-field">
      <label for="login-username">{{ t('login.username') }}</label>
      <input type="text" id="login-username" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="login-field">
      <label for="login-password">{{ t('login.password') }}</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn">{{ t('login.submit') }}</button>
  </form>
</div>
<div class="login-footer">
  <a href="/">{{ t('login.home') }}</a>
  <a href="/about">{{ t('login.about') }}</a>
  <span class="sep">·</span>
  {% for lc in supported_locales %}
    {% if lc != locale %}
    <a href="/i18n/set/{{ lc }}?next=/login">{{ locale_labels[lc] }}</a>
    {% else %}
    <span class="locale-active">{{ locale_labels[lc] }}</span>
    {% endif %}
  {% endfor %}
</div>
</body>
</html>
